repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.3.3
    hooks:
      - id: prettier
        types_or: [markdown]
        # CHANGELOG.md is generated by semantic-release; prettier would reformat it and fail
        # the release commit's CI. `exclude` (not .prettierignore) also avoids prettier's
        # "No matching files" error when a commit touches only the changelog.
        exclude: ^CHANGELOG\.md$
