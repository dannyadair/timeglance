name: bandit

on:
  pull_request:
    branches: ["main*"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Run bandit
        run: uv run bandit -r src/timeglance -c pyproject.toml
