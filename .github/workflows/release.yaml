name: Release

on:
  push:
    branches: [main]

# Minimal default; the jobs that need more widen it themselves (contents: write to push the
# release commit and attach the .deb, id-token: write for PyPI trusted publishing).
permissions:
  contents: read

# semantic-release pushes its `RELEASE: {version}` commit with a PAT, which re-triggers this
# workflow. That commit has nothing to test or release, so skip every job on it (the alternative,
# `[skip ci]` in the commit message, works too but is less explicit). On the RELEASE commit all
# jobs skip; `release` needs the skipped jobs, so it skips with them.
jobs:
  pre-commit:
    if: ${{ !startsWith(github.event.head_commit.message, 'RELEASE:') }}
    uses: ./.github/workflows/pre-commit.yaml
  tests:
    if: ${{ !startsWith(github.event.head_commit.message, 'RELEASE:') }}
    uses: ./.github/workflows/tests.yaml
    secrets: inherit # pass CODECOV_TOKEN through to the reusable workflow for the coverage upload
  release:
    name: Release
    needs: [pre-commit, tests] # a broken build never reaches the release step
    if: ${{ !startsWith(github.event.head_commit.message, 'RELEASE:') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10
        with:
          github_token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  # Publish to PyPI only when a release was actually cut (gated on the action's structured
  # `released` output, never log-grepping) AND the .deb installed and passed its full test suite on
  # every target distro - PyPI uploads are irreversible, so they wait on the strongest end-to-end
  # check we have (the same code, imported and rendering on real 3.12/3.13/3.14). It runs in the
  # `pypi` environment, so the OIDC token - and thus publishing rights - is scoped to this job
  # rather than the whole workflow. Trusted publishing means no API token, and
  # gh-action-pypi-publish attaches sigstore attestations by default.
  publish:
    name: Publish to PyPI
    needs: [release, deb-test]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/timeglance
    permissions:
      id-token: write
      contents: read # checkout; keep this job's grant minimal alongside id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }} # the tag semantic-release just pushed
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build distributions
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # Build a proper Debian source package with debhelper + dh-python (pybuild), producing the
  # pure-Python timeglance under /usr/lib/python3/dist-packages plus the wheel's own
  # /usr/bin/timeglance console script, run by the distro's python3 with every dependency
  # satisfied by apt packages (Depends:). It is Architecture: all - no bundled interpreter,
  # venv or wheels - so apt matches each dependency's C extensions to whatever python the target
  # ships. Gated on an actual release, like publish.
  #
  # Built inside an ubuntu:25.10 container, not on the 24.04 runner: our pyproject uses the
  # PEP 639 license metadata (`license = "MIT"`, `license-files = [...]`) that hatchling only
  # understands from 1.27 on, and 24.04 still ships 1.21. The output is Architecture: all, so
  # the build distro doesn't matter - deb-test proves it installs on 24.04/25.10/26.04.
  deb-build:
    name: Build .deb
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
      - name: Build the package
        run: |
          docker run --rm -v "$PWD:/w" -e VERSION="$VERSION" -e DEBIAN_FRONTEND=noninteractive ubuntu:25.10 bash -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              build-essential dpkg-dev debhelper dh-python pybuild-plugin-pyproject python3-hatchling python3-all
            cp -a /w /build && cd /build
            sed -i "1s/^timeglance (.*)/timeglance ($VERSION)/" debian/changelog
            dpkg-buildpackage -us -uc -b
            cp "../timeglance_${VERSION}_all.deb" /w/
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: timeglance_${{ env.VERSION }}_all.deb

  # Install the .deb in a fresh container of each supported distro (apt resolves the Depends from
  # that distro's archive) and exercise it against that distro's own library stack: the smoke paths
  # (the import that used to crash, the CLI, both renders, the poppler wallpaper rasterisation), the
  # render-correctness check, and the full unit suite run against the *installed* package - so a
  # broken package can never reach the Release. The matrix is the set of distros we commit to
  # supporting; a newer release we haven't added yet may happen to work, but that isn't promised
  # until it's in the matrix.
  deb-test:
    name: Test .deb
    needs: [release, deb-build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:25.10", "ubuntu:26.04"]
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
      - name: Install and test in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e DEBIAN_FRONTEND=noninteractive ${{ matrix.image }} bash -euc '
            apt-get update -qq
            apt-get install -y -qq "./timeglance_'"$VERSION"'_all.deb" python3-pytest
            bash debian/tests/smoke
            bash debian/tests/render-correctness
            bash debian/tests/unit
          '

  # Attach the .deb to the GitHub Release only after every distro passed its install-test, together
  # with a signed SLSA build-provenance attestation. The attestation proves this exact .deb came
  # from this workflow (`gh attestation verify timeglance_*.deb -R dannyadair/timeglance`) and,
  # shipped as a release asset, satisfies Scorecard's Signed-Releases check.
  deb-release:
    name: Attach .deb
    needs: [release, deb-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload the asset to the release
      id-token: write # OIDC identity that signs the provenance
      attestations: write # record the provenance attestation
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: timeglance_${{ env.VERSION }}_all.deb
      - name: Attach the .deb and its provenance to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout here, so point gh at the repo explicitly
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "timeglance_${VERSION}_all.deb.intoto.jsonl"
          gh release upload "$VERSION" \
            "timeglance_${VERSION}_all.deb" \
            "timeglance_${VERSION}_all.deb.intoto.jsonl" --clobber
