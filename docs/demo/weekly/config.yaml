# ============================================================================
# Demo data behind the README / docs screenshots (docs/images/weekly*.png).
# Committed sample data - NOT a personal config - so the screenshots are
# reproducible. Load it with TIMEGLANCE_HOME=docs/demo. A render change means
# refreshing four shots together: the two *_output.png renders and the two
# control-panel captures (year.png / weekly.png).
# ============================================================================

title: Weekly Routine
subtitle: At a glance

paper: A4    # A4 | A3 (landscape)   - override per-run with --paper
format: pdf  # pdf | html | both     - override per-run with --format

days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
day_start: "06:00"
day_end: "22:00"
hour_marks: 1

# Topic catalogue: label + colour, referenced by activities below. `visible: false` hides
# a topic's activities by default (toggle any of them on/off in the UI, or with --hide /
# --only). Here the morning slot starts on Walk; tick Gym (and untick Walk) to swap it in.
topics:
  work:     { label: Work,             color: "#3D6FB4" }
  walk:     { label: Walk,             color: "#2E9E5B" }
  gym:      { label: Gym,              color: "#E8743B", visible: false }
  meals:    { label: Meals,            color: "#D64550" }
  learning: { label: Learning,         color: "#7B5EA7" }
  hobby:    { label: Hobby,            color: "#1CA4A4" }
  social:   { label: Friends & family, color: "#C9459E" }
  downtime: { label: Downtime,         color: "#E0A000" }

# Weekly activities. `label` is optional (defaults to the topic label). To drop a one-off,
# comment it out; to swap a whole topic in/out, toggle its visibility (above / in the UI).
activities:
  # Morning movement - Walk shows by default; tick Gym (and untick Walk) to swap it in.
  - { days: [Mon, Wed, Fri], start: "06:45", end: "07:30", topic: walk }
  - { days: [Mon, Wed, Fri], start: "06:30", end: "07:30", topic: gym }
  - { days: [Sat],           start: "08:30", end: "10:00", topic: walk, label: Long walk }

  # Meals
  - { days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], start: "07:45", end: "08:15", topic: meals, label: Breakfast }
  - { days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun], start: "18:30", end: "19:15", topic: meals, label: Dinner }

  # Work
  - { days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00", topic: work }

  # Evenings
  - { days: [Tue, Thu], start: "19:30", end: "20:30", topic: learning, label: Study }
  - { days: [Mon, Wed], start: "20:00", end: "21:00", topic: hobby }
  - { days: [Fri],      start: "19:30", end: "22:00", topic: social, label: Friends }
  - { days: [Sat],      start: "20:00", end: "22:00", topic: hobby, label: Game night }
  - { days: [Sun],      start: "12:00", end: "15:00", topic: social, label: Family lunch }

  # Wind down
  - { days: [Mon, Tue, Wed, Thu, Sun], start: "21:15", end: "22:00", topic: downtime, label: Reading }

# Desktop wallpaper (KDE Plasma; --wallpaper). The page-shaped sheet is centred on a
# solid canvas at each screen's native resolution.
wallpaper:
  background: "#2b2f36" # canvas colour behind the sheet
  margin: 0.05          # fraction of the screen's short edge kept clear around the sheet
  screens: all          # all | primary | comma list of output names (e.g. eDP-1,HDMI-A-1)
  # A soft drop shadow makes the sheet read as a page on the desk. `false` disables it;
  # otherwise override any of these (opacity is 0-255; the rest are fractions of the short edge):
  # shadow: { opacity: 120, blur: 0.013, offset: 0.006, radius: 0.006 }
